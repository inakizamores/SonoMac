name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    # macOS 26 runner: the app must link against the macOS 26 SDK or the OS
    # renders it with legacy (pre-Tahoe) window chrome.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Build release artifacts
        run: ./release.sh

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/SonoMac.dmg
            dist/SonoMac.zip
          generate_release_notes: true
